services:
  # ============================================================================
  # Central FastAPI Backend Gateway (MEMBER 4 + Member 1 & 2 Engine Integrations)
  # ============================================================================
  backend:
    build:
      context: ./MEMBER 4
      dockerfile: Dockerfile
    container_name: orbi-sync-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-dev-admin-secret-key-12345}
      - OPERATOR_API_KEY=${OPERATOR_API_KEY:-dev-operator-secret-key-12345}
      - DIAGNOSTIC_API_KEY=${DIAGNOSTIC_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000}
      - CORS_ORIGIN_REGEX=${CORS_ORIGIN_REGEX:-^https?://(localhost|127\.0\.0\.1)(:\d+)?$}
      - PYTHONPATH=/app:/app/member2
    volumes:
      # Mount Member 1 orbital datasets and ephemeris (read-only)
      - ./member 1:/app/member 1:ro
      # Mount Member 2 risk & multi-agent coordination engine (read-only)
      - ./member2:/app/member2:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - orbi-network

  # ============================================================================
  # Mission Control Frontend (Next.js 16 + CesiumJS 3D Earth)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orbi-sync-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - orbi-network

networks:
  orbi-network:
    name: orbi-sync-network
    driver: bridge
